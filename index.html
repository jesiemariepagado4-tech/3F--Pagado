<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
<style>
    body {
        background: #f3c9e2;
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .card {
        width: 300px;
        background: #f29bc0;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        overflow: hidden;
        color: #fff;
        text-align: center;
    }

    .card-header {
        background: #ffe6f2;
        padding: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .profile-letter {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: #ffb6d5;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        font-weight: bold;
        border: 5px solid #fff5fa;
    }

    .card-body {
        padding: 20px;
    }

    .location {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        color: #ffe0f1;
        margin-bottom: 5px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 15px 0;
    }

    .btn {
        padding: 8px 18px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        transition: 0.3s;
    }

    .btn-message {
        background: #fff;
        color: #ff5ea2;
    }
    .btn-follow {
        background: #ff80bf;
        color: #fff;
        border: 1px solid #ff80bf;
    }

    .btn:hover {
        transform: scale(1.05);
    }

    .skills {
        text-align: left;
        font-size: 13px;
        padding: 0 20px 15px;
    }

    .skills span {
        display: inline-block;
        margin-right: 10px;
        margin-top: 5px;
        color: #ffffff;
        background: rgba(255,255,255,0.15);
        padding: 4px 8px;
        border-radius: 4px;
    }
</style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <div class="profile-letter">J</div>
    </div>

    <div class="card-body">
        <h3>Jesie Marie Pagado</h3>
        
        <div class="location">
            <span>📍</span> <p>Philippines</p>
        </div>

        <p style="font-size: 12px; color:#ffffff;">
            Web Developer & Designer <br>
            Student at STI West Negros University
        </p>

        <div class="buttons">
            <button class="btn btn-message">Message</button>
            <button class="btn btn-follow">Follow</button>
        </div>

        <div class="skills">
            <strong>SKILLS</strong> <br><br>
            <span>HTML</span><span>CSS</span><span>JavaScript</span>
            <span>UI/UX</span><span>React</span><span>Bootstrap</span>
        </div>
    </div>
</div>

</body>
</html>
