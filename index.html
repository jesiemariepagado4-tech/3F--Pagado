<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    body {
      background: #b2b6ff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      width: 260px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      background: linear-gradient(to bottom, #e8e7f3 30%, #b86e9f 30%);
      text-align: center;
      color: #fff;
    }

    .card-header {
      padding: 30px 0 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-letter {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #f4a7d3;
      color: white;
      font-size: 55px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 5px solid #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .card-body {
      padding: 15px 20px 20px;
      margin-top: 10px;
    }

    .card-body h3 {
      margin: 5px 0;
      font-size: 17px;
      font-weight: 600;
    }

    .location {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #fcdaf0;
      margin-bottom: 8px;
    }

    .description {
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 12px;
      color: #fff;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-message {
      background: #fff;
      color: #000;
    }

    .btn-follow {
      background: #f17cc5;
      color: #fff;
      border: 1px solid #f17cc5;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .skills {
      text-align: left;
      font-size: 11px;
      color: #fff;
    }

    .skills strong {
      display: block;
      margin-bottom: 5px;
    }

    .skills span {
      display: inline-block;
      margin-right: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="profile-letter">JM</div>
    </div>

    <div class="card-body">
      <h3>Jesie Marie Pagado</h3>

      <div class="location">
        <span>📍</span><p>PHILIPPINES</p>
      </div>

      <p class="description">
        UI/UX designer
